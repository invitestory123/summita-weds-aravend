<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arvend &amp; Summita — Wedding Invitation</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Audio -->
    <audio id="wedding-bg-audio" loop preload="auto" playsinline webkit-playsinline>
      <source src="./asbg.mp3" type="audio/mpeg" />
      <source src="asbg.mp3" type="audio/mpeg" />
      <source src="./asbg.mpeg" type="audio/mpeg" />
    </audio>

    <script>
      (function () {
        var audio = document.getElementById("wedding-bg-audio");
        if (!audio) return;

        try {
          var resolvedSrc = new URL("asbg.mp3", document.baseURI || window.location.href).href;
          if (!audio.src) {
            audio.src = resolvedSrc;
          }
        } catch (e) {}

        audio.volume = 0.75;
        audio.preload = "auto";

        var isPlayPending = false;
        var hasStarted = false;

        function resumeAudioContext() {
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              if (!window._audioCtx) {
                window._audioCtx = new AudioCtx();
              }
              if (window._audioCtx.state === "suspended") {
                window._audioCtx.resume();
              }
            }
          } catch (e) {}
        }

        function safePlay() {
          if (!audio) return;
          if (!audio.paused) {
            hasStarted = true;
            cleanupTriggers();
            return;
          }
          if (isPlayPending) return;

          isPlayPending = true;
          audio.muted = false;
          resumeAudioContext();

          var p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              isPlayPending = false;
              hasStarted = true;
              cleanupTriggers();
            }).catch(function () {
              isPlayPending = false;
            });
          } else {
            isPlayPending = false;
            hasStarted = true;
            cleanupTriggers();
          }
        }

        function onFirstGesture(e) {
          if (hasStarted) {
            cleanupTriggers();
            return;
          }
          if (e && e.target) {
            var el = e.target instanceof Element ? e.target : e.target.parentElement;
            if (el && el.closest && el.closest("#music-toggle-btn")) {
              return;
            }
          }
          safePlay();
        }

        var events = ["pointerdown", "touchstart", "touchend", "click", "keydown"];

        function cleanupTriggers() {
          events.forEach(function (evt) {
            window.removeEventListener(evt, onFirstGesture, true);
            document.removeEventListener(evt, onFirstGesture, true);
          });
        }

        events.forEach(function (evt) {
          window.addEventListener(evt, onFirstGesture, { capture: true, passive: true });
          document.addEventListener(evt, onFirstGesture, { capture: true, passive: true });
        });

        // 1. Try playing immediately upon HTML parsing
        safePlay();

        // 2. Try playing on DOMContentLoaded and Window Load
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", safePlay, { once: true });
        }
        window.addEventListener("load", safePlay, { once: true });

        // Expose controller for React UI
        window.weddingAudio = {
          audio: audio,
          play: safePlay,
          pause: function () {
            if (audio) audio.pause();
          },
          toggle: function () {
            if (!audio) return;
            if (audio.paused) {
              safePlay();
            } else {
              audio.pause();
            }
          },
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
